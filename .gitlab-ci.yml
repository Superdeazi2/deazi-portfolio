image: node:20

stages:
  - build
  - deploy

build_job:
  stage: build
  script:
    - yarn install --frozen-lockfile
    - yarn build
  artifacts:
    paths:
      - dist
  only:
    - main

pages:
  stage: deploy
  dependencies:
    - build_job
  script:
    - mkdir -p public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  only:
    - main
